[package]
name = "streambox"
version = "0.1.0"
description = "StreamBox IPTV Player"
authors = ["Osmel"]
edition = "2021"

[lib]
name = "streambox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2"
